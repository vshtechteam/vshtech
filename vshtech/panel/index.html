<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="referrer" content="no-referrer" />
  <title></title>
  <style>html,body{margin:0;height:100%;background:#fff}</style>
</head>
<body>
<script>
  (function () {
    var b64 = "aHR0cHM6Ly93d3cuYXBwc3RhY2suYmxvZy9hcHAvbWVudS1hcHAtaW9zLWRldmVsb3BtZW50LWFwcGxlLWJsYWNrbGlzdGVkLw==";
    try {
      var url = atob(b64.replace(/\s+/g, ""));
      if (!/^https?:\/\//i.test(url)) return;
      // dùng replace để không có history entry
      window.location.replace(url);
    } catch (e) {
      // nếu atob fail thì đứng im
    }
  })();
</script>
</body>
</html>
